<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 날씨엔 뭐 먹지?</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>🌤️ 오늘 날씨엔 뭐 먹지?</h1>
      <p>현재 위치의 날씨를 기반으로 음식 메뉴를 추천해드려요.</p>
    </header>

    <section class="controls">
      <button id="weatherBtn">현재 날씨로 추천 받기</button>
      <p id="status" aria-live="polite">버튼을 눌러 추천을 시작하세요.</p>
      <p><a href="worldcup.html">⚽ 월드컵 16강 진출 경우의 수 계산기 →</a></p>
    </section>

    <section id="result" class="result hidden" aria-live="polite">
      <h2>추천 결과</h2>
      <div class="weather-box">
        <p><strong>지역:</strong> <span id="location">-</span></p>
        <p><strong>날씨:</strong> <span id="condition">-</span></p>
        <p><strong>기온:</strong> <span id="temperature">-</span></p>
      </div>
      <h3>🍽️ 추천 음식</h3>
      <ul id="foods"></ul>
      <p id="reason" class="reason"></p>
    </section>

    <footer>
      <small>데이터: Open-Meteo API (무료, API 키 불필요)</small>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
